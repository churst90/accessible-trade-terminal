<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Accessible Trade Terminal</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="AccessibleTrader.BlazorClient.styles.css" />
    <link rel="icon" href="data:,">
    <!-- Inline transparent background applied synchronously before app.css loads,
         preventing the WebView2 white flash during Blazor bootstrap. -->
    <style>
        html, body, #app { background: transparent !important; }
        /* Boot screen shown immediately while the .NET runtime + services start
           and Blazor bootstraps (can take a while on first launch). Blazor
           replaces #app's content once MainLayout mounts, removing this. */
        .boot-screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; background: #1a1a1a; color: #dcdcdc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .boot-title { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.5px; color: #4ec9b0; }
        .boot-sub { font-size: 0.95rem; color: #9aa; }
        .boot-spinner {
            width: 46px; height: 46px; border: 4px solid #333;
            border-top-color: #4ec9b0; border-radius: 50%;
            animation: boot-spin 0.9s linear infinite;
        }
        @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div id="app">
        <div class="boot-screen" role="status" aria-live="polite" aria-label="Loading Accessible Trader, please wait">
            <div class="boot-spinner" aria-hidden="true"></div>
            <div class="boot-title">Accessible Trader</div>
            <div class="boot-sub">Loading… please wait</div>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert" aria-live="assertive" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" role="button" tabindex="0" aria-label="Dismiss error">&#x2715;</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/canvasRegion.js"></script>
    <script src="js/treeKeyboard.js"></script>
</body>

</html>
