name: xunit

# Runs AccessibleTrader.Tests on every PR targeting main and every push to
# main. Fails the check if any test regresses. The live test count is
# verified against docs/README.md by the doc-drift workflow.
#
# Test project targets plain net10.0 — no MAUI workloads needed. Runs on
# Ubuntu for speed; the tests are platform-agnostic (Roslyn compile,
# indicator math, accessibility pipeline, hostile-script rejection).
# Platform-specific OS-sandbox smoke tests (AppContainer on Windows,
# sandbox-exec on macOS, isolatedProcess on Android) belong in separate
# workflows with the corresponding runners.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xunit:
    name: Run xunit suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned, not 10.0.x — SDK 10.0.400's rzc crashes nondeterministically
      # on WebHost's Razor compile; see the comment in doc-drift.yml.
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Restore
        # Restoring only the Tests project pulls in the transitive refs we
        # need (Core, Sdk, ScriptSandbox, ScriptWorker, indicator plugins
        # under test). Avoids the MAUI workload dance the BlazorClient
        # needs.
        run: dotnet restore AccessibleTrader.Tests/AccessibleTrader.Tests.csproj

      - name: Build
        run: |
          dotnet build AccessibleTrader.Tests/AccessibleTrader.Tests.csproj \
            --configuration Release \
            --no-restore

      - name: Test
        run: |
          dotnet test AccessibleTrader.Tests/AccessibleTrader.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx"

      # JS gesture-engine tests (Phase C/F). Plain Node, zero dependencies —
      # loads wwwroot/js/keyboard.js into a vm sandbox and asserts the .NET
      # bridge calls each touch/mouse gesture emits. ubuntu-latest ships Node,
      # so no setup step is needed.
      - name: JS gesture tests
        run: node tools/jstests/gesture-tests.mjs

      # The keydown half of the same file. Separate suite because it asserts on
      # something the C# tests structurally cannot see: whether the trap called
      # preventDefault. That blind spot is what let Space cancel the activation
      # click on every button in the app without a single test noticing.
      - name: JS keyboard tests
        run: node tools/jstests/keyboard-tests.mjs

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: AccessibleTrader.Tests/TestResults/*.trx
          retention-days: 14

  # ── Browser harness ────────────────────────────────────────────────────────
  #
  # AccessibleTrader.BrowserTests drives a real Chromium against a real Kestrel
  # running the real WebHost. It is a SEPARATE job, not another filter on the
  # xunit one, because it must not run interleaved with the ~4,800 in-process
  # tests: the A2 audit (2026-08-26) measured what heavyweight tests contending
  # for the thread pool do to that suite — seven spurious failures in 28 runs,
  # five of them the only failure in their run.
  #
  # It exists because the suite above is structurally blind to a whole class of
  # bug. Alt+T opened the trading dashboard without moving focus and survived a
  # dedicated focus-contract suite, a modal catalog and 4,830 green tests,
  # because bUnit applies a render synchronously and a browser does not.
  #
  # Without a browser installed every test here SKIPS, which is why
  # HarnessSmokeTests.The_browser_suite_reports_whether_it_can_actually_run
  # fails rather than skips: a silently-skipped browser suite is a green run
  # that means nothing.
  #
  # A note on the timeout, because this job has already been killed by it. Its
  # first two runs (b157e554, e7170b95) hit the 25-minute cap and were
  # CANCELLED, which is a worse outcome than failing: `if: failure()` does not
  # run on a cancelled job, so no .trx was uploaded and the only evidence left
  # was the log. The cause was one broken host — Release built the WebHost as
  # WinExe, which drops _framework/blazor.web.js from the static-asset manifest,
  # so the Blazor circuit never started — but the suite re-discovered that 45
  # times at 30 seconds each. TerminalBrowserFixture now latches the first
  # "app never loaded" and fails the rest instantly, so this job reports a
  # failure with artifacts in seconds instead of a cancellation in 25 minutes.
  # WebHostStaticAssetManifestTests catches that particular cause in the xunit
  # job, before a browser is ever launched.
  browser:
    name: Browser harness (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Restore
        run: dotnet restore AccessibleTrader.BrowserTests/AccessibleTrader.BrowserTests.csproj

      - name: Build
        run: |
          dotnet build AccessibleTrader.BrowserTests/AccessibleTrader.BrowserTests.csproj \
            --configuration Release \
            --no-restore \
            -p:UseRazorSourceGenerator=false

      # The version must match the Microsoft.Playwright PackageReference: the
      # .NET driver looks for one exact browser build number.
      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Test
        run: |
          dotnet test AccessibleTrader.BrowserTests/AccessibleTrader.BrowserTests.csproj \
            --configuration Release \
            --no-build \
            -p:UseRazorSourceGenerator=false \
            --logger "trx;LogFileName=browser-results.trx"

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: AccessibleTrader.BrowserTests/TestResults/*.trx
          retention-days: 14

  # ── MAUI head compile check ────────────────────────────────────────────────
  #
  # The MAUI desktop head was ONLY built by release.yml, which runs on a tag.
  # That meant a compile break in it surfaced at the moment of cutting a
  # release — the most expensive point possible — and it is why two releases
  # in a row shipped that head having never been built during their own
  # development cycle. This job moves the discovery to the commit that caused
  # it.
  #
  # It BUILDS, it does not publish: publishing adds several minutes of
  # self-contained trimming that proves nothing extra about whether the code
  # compiles, and release.yml still does the real publish. It also cannot
  # prove the head RUNS — app.css is not compiled and no CI job launches a
  # window — so the hands-on launch stays on the release checklist.
  #
  # Push-to-main and manual dispatch only, deliberately. Windows runners bill
  # at a higher multiplier than Ubuntu, and catching a break within one commit
  # is worth far more than catching it one PR iteration earlier.
  maui-windows-build:
    name: MAUI Windows head compiles
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Install MAUI workload
        run: dotnet workload install maui

      # Same TFM release.yml publishes. The Razor source generator is disabled
      # for the same reason it is everywhere else in this repo: SDK 10.0.301
      # miscompiles `<text>` and same-line code-block markup.
      - name: Build MAUI Windows head
        shell: pwsh
        run: |
          dotnet build AccessibleTrader.BlazorClient/AccessibleTrader.BlazorClient.csproj `
            --framework net10.0-windows10.0.19041.0 `
            --configuration Release `
            -p:UseRazorSourceGenerator=false
