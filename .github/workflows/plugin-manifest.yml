name: plugin-trust-manifest

# Emits plugins_trusted.manifest alongside a Release build of the BlazorClient
# and uploads it as an artifact. On tag pushes (v*), also publishes the
# manifest as a GitHub Release asset so installer packaging has a canonical
# source for the file that ships next to the app binary.
#
# The manifest is generated by the GeneratePluginTrustManifest MSBuild target
# in AccessibleTrader.BlazorClient.csproj — this workflow just builds, then
# picks the produced file out of OutDir and uploads it.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: plugin-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manifest:
    name: Build + capture manifest
    # Windows-first: the BlazorClient multi-targets but net10.0-windows is the
    # config that produces the binaries real customers install. Other TFMs can
    # be added once CI also produces their installers.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore AccessibleTrader.BlazorClient/AccessibleTrader.BlazorClient.csproj

      - name: Build Release (net10.0-windows)
        shell: pwsh
        run: |
          # No --no-restore: the windows TFM's implicit runtime pack (win-x64)
          # must be restored with the full build context — a bare `dotnet restore`
          # doesn't fetch it and the build then dies with NETSDK1112.
          dotnet build AccessibleTrader.BlazorClient/AccessibleTrader.BlazorClient.csproj `
            --configuration Release `
            --framework net10.0-windows10.0.19041.0 `
            -p:WindowsPackageType=None

      - name: Locate produced manifest
        id: locate
        shell: pwsh
        run: |
          $manifest = Get-ChildItem `
            -Path AccessibleTrader.BlazorClient/bin/Release `
            -Recurse -Filter plugins_trusted.manifest `
            | Select-Object -First 1
          if (-not $manifest) {
            Write-Error "plugins_trusted.manifest not found under bin/Release — did GeneratePluginTrustManifest run?"
            exit 1
          }
          Write-Output "Manifest at: $($manifest.FullName)"
          Write-Output ""
          Write-Output "─── contents ─────────────────────────────────"
          Get-Content $manifest.FullName
          Write-Output "──────────────────────────────────────────────"
          "manifest-path=$($manifest.FullName)" >> $env:GITHUB_OUTPUT

      - name: Sanity-check manifest has entries
        shell: pwsh
        run: |
          $manifest = "${{ steps.locate.outputs.manifest-path }}"
          $hashLines = (Get-Content $manifest) | Where-Object { $_ -match '^[0-9A-Fa-f]{64}' }
          if ($hashLines.Count -lt 10) {
            Write-Error "Manifest has only $($hashLines.Count) hash entries — expected at least 10 (13 trading + 12 analytics providers ship)."
            exit 1
          }
          Write-Output "Manifest has $($hashLines.Count) plugin hashes."

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugins_trusted.manifest
          path: ${{ steps.locate.outputs.manifest-path }}
          retention-days: 30
          if-no-files-found: error

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.manifest-path }}
          fail_on_unmatched_files: true
