name: diagnostic-build

# Builds the MAUI Windows head on demand and uploads it as a workflow ARTIFACT.
# No tag, no GitHub Release, nothing public — this exists so a fix can be put in
# front of a real screen reader on a real Windows machine without cutting a
# release for it.
#
# Why it exists at all: the MAUI Windows head CANNOT be built anywhere but
# Windows (net10.0-windows10.0.19041.0 needs the Windows SDK), so a developer on
# Linux has no way to produce a testable binary. Before 2026-09-21 that meant the
# only way to get one was a release, which is why this head went unmeasured with
# a screen reader for the life of the project.
#
# Trigger: Actions → diagnostic-build → Run workflow.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: false
        default: 'main'

jobs:
  maui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Install MAUI workload
        run: dotnet workload install maui

      # ── The NVDA Controller Client ────────────────────────────────────────
      #
      # Fetched rather than committed. It is a third-party binary (NV Access,
      # LGPL 2.1) and vendoring it into the repo is a distribution decision that
      # has not been taken; downloading it here keeps the provenance explicit and
      # the build reproducible, at the cost of one network call.
      #
      # Without it the desktop head is MUTE while the chart has focus — the chart
      # is a native SkiaSharp canvas over the BlazorWebView, so a reader following
      # focus onto it is not reading the web view's DOM and the ARIA live region
      # announces to nobody. See docs/PLATFORMS.md.
      - name: Fetch NVDA Controller Client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path vendor/nvda | Out-Null

          # The controller client is NOT a GitHub release asset — nvaccess/nvda releases
          # carry only the installer .exe. It lives on NV Access's own download server, at
          # a path keyed by the NVDA version, so the version comes from the GitHub tag
          # ("release-2026.2") and the download comes from nvaccess.org.
          $headers = @{ 'User-Agent' = 'accessible-trade-terminal-ci' }
          $release = Invoke-RestMethod -Headers $headers `
            -Uri 'https://api.github.com/repos/nvaccess/nvda/releases/latest'
          $version = $release.tag_name -replace '^release-', ''
          $url = "https://www.nvaccess.org/files/nvda/releases/$version/nvda_${version}_controllerClient.zip"

          Write-Host "NVDA $version -> $url"
          Invoke-WebRequest -Headers $headers -Uri $url -OutFile controllerClient.zip
          Expand-Archive -Path controllerClient.zip -DestinationPath controllerClient -Force

          # x64 specifically: the archive also holds x86, arm64 and arm64ec builds, and the
          # head publishes win-x64.
          $dll = Join-Path controllerClient 'x64/nvdaControllerClient.dll'
          if (-not (Test-Path $dll)) {
            throw "x64/nvdaControllerClient.dll not found in $url. The archive layout changed; check it by hand."
          }

          Copy-Item $dll -Destination vendor/nvda/nvdaControllerClient.dll -Force
          Write-Host "Staged vendor/nvda/nvdaControllerClient.dll"

      - name: Publish MAUI Windows
        shell: pwsh
        run: |
          dotnet publish AccessibleTrader.BlazorClient/AccessibleTrader.BlazorClient.csproj `
            --framework net10.0-windows10.0.19041.0 `
            --configuration Release `
            -p:ReleasePublish=true `
            --output publish/maui-win

      # The whole point of the NVDA work is that this file reaches a PUBLISH and
      # not merely a build. Fail loudly here rather than shipping a silent zip:
      # a diagnostic build that cannot speak tells us nothing.
      - name: Verify the NVDA client reached the publish output
        shell: pwsh
        run: |
          $staged = Get-ChildItem vendor/nvda -Filter 'nvdaControllerClient*.dll' -ErrorAction SilentlyContinue
          if (-not $staged) {
            Write-Error "No NVDA client was staged, so the produced build would be MUTE. Failing rather than shipping a silent diagnostic build."
            exit 1
          }
          foreach ($f in $staged) {
            if (-not (Test-Path (Join-Path 'publish/maui-win' $f.Name))) {
              Write-Error "$($f.Name) was staged in vendor/nvda but did NOT reach the publish output. CopyToPublishDirectory is not taking effect."
              exit 1
            }
            Write-Host "$($f.Name) is in the publish output."
          }

      # Demonstrated on 2026-09-21 by unzipping the previous artifact: 33 plugin DLLs
      # present, plugins_trusted.manifest absent. With RequireTrusted enforcing an empty
      # allow-list that refuses all 33, and the application then behaves exactly as though
      # no plugins were installed — a symptom nobody reads as "a manifest is missing".
      - name: Verify the plugin trust manifest reached the publish output
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem publish/maui-win -Filter 'AccessibleTrader.Plugins.*.dll' -ErrorAction SilentlyContinue)
          if ($dlls.Count -eq 0) {
            Write-Error "No plugin DLLs in the publish output at all."
            exit 1
          }
          if (-not (Test-Path publish/maui-win/plugins_trusted.manifest)) {
            Write-Error "$($dlls.Count) plugin DLLs shipped with NO plugins_trusted.manifest. PluginTrustPolicy.RequireTrusted will refuse every one of them and the market dropdown will offer only the built-in providers."
            exit 1
          }

          # The manifest must describe the files that actually ship, not the ones in the
          # build output: a digest over the wrong bytes produces a refusal identical to a
          # missing manifest.
          $manifest = Get-Content publish/maui-win/plugins_trusted.manifest
          $missing = @()
          foreach ($dll in $dlls) {
            $hash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not ($manifest -match $hash)) { $missing += $dll.Name }
          }
          if ($missing.Count -gt 0) {
            Write-Error "These published plugin DLLs are not in the manifest, so they will be refused at runtime: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All $($dlls.Count) published plugin DLLs are covered by the manifest."

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path publish/maui-win/* -DestinationPath "dist/AccessibleTrader-Windows-diagnostic.zip" -Force
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleTrader-Windows-diagnostic
          path: dist/*.zip
          retention-days: 14
