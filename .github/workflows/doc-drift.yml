name: doc-drift

# Fails fast when the README / SHORTCUTS docs go out of sync with the code:
#   * shortcut bindings in ShortcutManager.InitializeDefaultProfile() vs docs/SHORTCUTS.md
#   * plugin directory count under Plugins/Providers + Plugins/Analytics vs docs/README.md
#   * live xunit test count vs docs/README.md
# See scripts/check_doc_drift.py for the full check list.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: doc-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Run doc-drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore test project (for --list-tests)
        run: dotnet restore AccessibleTrader.Tests/AccessibleTrader.Tests.csproj

      # Release, not Debug: with the Razor source generator disabled
      # (dotnet/razor#13184 workaround in the two Razor csprojs), the classic
      # `rzc generate` path crashes nondeterministically on Debug builds of
      # WebHost ("This writer does not support components", a race in its
      # parallel codegen). Release builds of the same tree — tests.yml and the
      # MAUI head job — have never tripped it. Same SDK either way, so this is
      # a config-flag interaction, not a version issue.
      - name: Build test project
        run: dotnet build AccessibleTrader.Tests/AccessibleTrader.Tests.csproj --configuration Release --no-restore

      - name: Run doc-drift guard
        run: python scripts/check_doc_drift.py
        env:
          DOC_DRIFT_CONFIG: Release
